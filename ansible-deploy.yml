- hosts: localhost
  connection: local
  tasks:
    - name: Install desktop packages
      become: true
      pacman:
        name:
          - xorg
          - xorg-xinit
          - greetd
          - greetd-tuigreet
          - i3-wm
          - i3status
          - i3lock
          - dmenu
          - alacritty
          - ttf-fira-code
          - feh
          - xf86-input-libinput
        state: present

    - name: Deploy system-wide configuration
      become: true
      copy:
        src: files/etc/
        dest: /etc/
        owner: root
        group: root
        mode: "0644"
        directory_mode: "0755"

    - name: Enable greetd at boot
      become: true
      systemd_service:
        name: greetd.service
        enabled: true

    - name: Configure console keyboard colemak layout
      become: true
      lineinfile:
        path: /etc/vconsole.conf
        regexp: '^KEYMAP='
        line: 'KEYMAP=colemak'
        create: true
        owner: root
        group: root
        mode: "0644"

    - name: Deploy user config files
      copy:
        src: files/config/
        dest: ~/.config/
        mode: "0644"

    - name: Deploy wallpaper
      copy:
        src: assets/
        dest: ~/.local/assets/
        mode: "0644"

    - name: Load custom Bash configuration
      blockinfile:
        path: "{{ ansible_facts['env']['HOME'] }}/.bashrc"
        marker: "# {mark} ANSIBLE MANAGED BASH CONFIG"
        block: |
          if [ -f "$HOME/.config/bash/bashrc" ]; then
              . "$HOME/.config/bash/bashrc"
          fi
