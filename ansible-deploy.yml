- hosts: localhost
  connection: local
  tasks:
    - name: Install desktop packages
      become: true
      pacman:
        name:
          - xorg
          - xorg-xinit
          - i3-wm
          - i3status
          - i3lock
          - dmenu
          - alacritty
          - ttf-fira-code
        state: present
    - name: Deploy config files
      copy:
        src: files/config/
        dest: ~/.config/
        mode: "0644"
