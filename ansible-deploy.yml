- hosts: localhost
  connection: local
  tasks:
    - name: Install desktop packages on Arch
      become: true
      pacman:
        name:
          - xorg
          - xorg-xinit
          - i3-wm
          - i3status
          - i3lock
          - dmenu
          - alacritty
          - ttf-fira-code
          - feh
        state: present
      when: ansible_facts['distribution'] == 'Archlinux'
    - name: Install desktop packages on Ubuntu
      become: true
      apt:
        name:
          - xorg
          - xinit
          - i3-wm
          - i3status
          - i3lock
          - suckless-tools
          - alacritty
          - fonts-firacode
          - feh
        state: present
        update_cache: true
        cache_valid_time: 3600
      when: ansible_facts['distribution'] == 'Ubuntu'
    - name: Deploy wallpaper
      copy:
        src: assets/
        dest: ~/.local/assets/
        mode: "0644"
    - name: Deploy config files
      copy:
        src: files/config/
        dest: ~/.config/
        mode: "0644"
    - name: Load custom Bash configuration
      ansible.builtin.blockinfile:
        path: "{{ ansible_facts['env']['HOME'] }}/.bashrc"
        marker: "# {mark} ANSIBLE MANAGED BASH CONFIG"
        block: |
          if [ -f "$HOME/.config/bash/bashrc" ]; then
              . "$HOME/.config/bash/bashrc"
          fi
