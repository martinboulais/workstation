- hosts: localhost
  connection: local
  tasks:
    - name: Install desktop packages
      become: true
      pacman:
        name:
          - xorg
          - xorg-xinit
          - i3-wm
          - i3status
          - i3lock
          - dmenu
          - alacritty
          - ttf-fira-code
          - feh
        state: present
    - name: Deploy wallpaper
      copy:
        src: assets/
        dest: ~/.local/assets/
        mode: "0644"
    - name: Deploy config files
      copy:
        src: files/config/
        dest: ~/.config/
        mode: "0644"
    - name: Load custom Bash configuration
      ansible.builtin.blockinfile:
        path: "{{ ansible_env.HOME }}/.bashrc"
        marker: "# {mark} ANSIBLE MANAGED BASH CONFIG"
        block: |
          if [ -f "$HOME/.config/bash/bashrc" ]; then
              . "$HOME/.config/bash/bashrc"
          fi
